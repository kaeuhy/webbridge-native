name: "\U0001F41B Bug Report"
description: 확인된 버그 리포트
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        버그 리포트 감사합니다. 아래 정보를 가능한 한 자세히 적어주세요.

  - type: input
    id: package
    attributes:
      label: 영향 패키지
      description: 어느 패키지에서 발생했나요?
      placeholder: "@webbridge-native/cookies"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 버전
      placeholder: "0.2.1"
    validations:
      required: true

  - type: input
    id: rn-version
    attributes:
      label: React Native 버전
      placeholder: "0.74.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      multiple: true
      options:
        - iOS
        - Android
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 무엇이 잘못되었나요?
      description: 기대한 동작과 실제 동작의 차이를 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 단계
      description: |
        1. ...
        2. ...
        3. ...
      placeholder: |
        1. CookieJar 인스턴스 생성
        2. setCookie 호출
        3. 앱 재시작
        4. getCookieHeader 호출 → 빈 문자열 반환됨
    validations:
      required: true

  - type: textarea
    id: minimum-repro
    attributes:
      label: 최소 재현 코드 (있으면)
      render: typescript

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그/에러
      render: shell
